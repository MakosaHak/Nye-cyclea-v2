# Nye Cyclea — déploiement Netlify (site de test ou production)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm ci && npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# SPA — React Router (complète public/_redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour les assets fingerprintés
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
